# KYRO PRODUCTION producer settings (any producer we control, e.g. future
# re-ingestion/backfill tooling). Apply as client properties; do not copy into
# the local single-broker setup unless noted.
#
# Only durability-relevant properties are pinned; everything else stays at the
# Kafka default on purpose (no arbitrary tuning).

# Acks only after ALL in-sync replicas persisted the record. With
# min.insync.replicas=2 on the broker, the write fails instead of being lost
# when too few replicas are healthy. This is the property that makes
# "single broker failure must not lose accepted events" true end-to-end.
acks=all

# Idempotent producer: broker-side dedup by (producer.id, sequence) so retries
# cannot create duplicates or reorder records. Forces acks=all, retries=MAX and
# max.in.flight<=5 (the safe combination), so no extra retry tuning is needed.
# NOTE: this covers retries WITHIN the producer. If Kafka stays down longer
# than delivery.timeout.ms (default 120 s), the send fails -> rely on GitHub
# webhook redelivery (same X-GitHub-Delivery, consumer dedups by event.id).
enable.idempotence=true
