# KYRO PRODUCTION Kafka broker configuration - 3 brokers, RF=3.
#
# This file is a TEMPLATE: copy it to each broker and set the two per-broker
# values (node.id, advertised.listeners). Nothing here is applied to the local
# single-broker dev cluster.
#
# Only settings that differ from stock Kafka defaults, or that are required to
# enforce the agreed KYRO architecture, are listed. Every entry explains why.

# --- Per-broker values (set for each of the 3 brokers) -----------------------
# node.id=1                       # 1, 2, 3 - unique per broker
# advertised.listeners=PLAINTEXT://kyro-kafka-1:9092   # hostname of this broker

# --- KRaft combined mode (3 voters, one per broker) --------------------------
process.roles=broker,controller
controller.quorum.voters=1@kyro-kafka-1:9093,2@kyro-kafka-2:9093,3@kyro-kafka-3:9093
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER

# --- Durability ---------------------------------------------------------------
# New topics get 3 replicas so kyro.github.push exists on all 3 brokers.
# Required by: "single broker failure must NOT permanently lose accepted events".
default.replication.factor=3

# A write counts as acknowledged only while >= 2 replicas are in sync.
# Together with producer acks=all: a broker failure cannot silently lose the
# last acknowledged write (1 leader + 1 follower can still satisfy the write,
# and one of them can be elected leader).
min.insync.replicas=2

# Never elect a replica that is out of sync: an out-of-sync leader would
# serve/commit data that other replicas never received -> permanent loss.
# Kafka default is false; pinned explicitly because accidentally flipping it
# voids the durability guarantee above.
unclean.leader.election.enable=false

# Consumer group offsets and (unused today) transaction state must survive a
# single broker failure, otherwise consumers replay from scratch or fail over.
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

# --- Retention (agreed: 7 days) ----------------------------------------------
# Kafka is event streaming / durable buffering / replay - NOT the source of
# truth. 7 days gives a week of replay/recovery headroom, then data expires
# because persistence lives downstream (PostgreSQL + ChromaDB).
log.retention.ms=604800000
# cleanup.policy stays at the default "delete": compacted topics would retain
# keys forever, which contradicts the 7-day buffer role.
