# KYRO PRODUCTION consumer settings - ingestion workers.
# Consumer group: kyro-ingestion-workers (partitions are distributed among
# workers; a partition is never assigned to two consumers in one group).

group.id=kyro-ingestion-workers

# At-least-once: the worker commits an offset ONLY after the event was
# processed and persisted. Crash/failure before commit -> the same event is
# redelivered -> retries happen; event.id (X-GitHub-Delivery) makes the retry
# idempotent downstream. Auto-commit is forbidden here: it commits on a timer
# regardless of processing outcome and would skip failed events.
enable.auto.commit=false

# A brand-new consumer group starts at the oldest retained (7-day) event, so
# workers never silently skip history when the group is first created or its
# offsets expire.
auto.offset.reset=earliest
