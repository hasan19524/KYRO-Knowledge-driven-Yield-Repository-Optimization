# KYRO local development Kafka.
#
# Local = 1 broker (KRaft combined mode), RF=1, 5 partitions, 7-day retention.
# Production (3 brokers, RF=3) lives in ../production/ and is NOT applied here.
#
# Dual listener design:
#   HOST   :9092  advertised as localhost:9092  -> tools running on the host
#            (kafka CLI, verification scripts, local workers)
#   PLAINTEXT:29092 advertised as kyro-kafka:29092 -> containers on the
#            `kyro-net` Docker network (n8n). Not published to the host.
#   A single listener cannot serve both: the advertised address must be
#   resolvable by every client. `localhost` is only valid for host clients.

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kyro-kafka
    hostname: kyro-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # --- KRaft single-node ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kyro-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners (see header) ---
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kyro-kafka:29092,HOST://localhost:9092
      # CONTROLLER must map to a real protocol (PLAINTEXT here); Kafka rejects
      # "CONTROLLER:CONTROLLER" as an invalid security protocol.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single-broker local development: RF stays 1 ---
      # Never set these to 3 here: RF=3 requires 3 brokers (see ../production/).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # --- Agreed retention: 7 days (Kafka is a buffer, not source of truth) ---
      KAFKA_LOG_RETENTION_MS: 604800000

      # --- Persist topic data across container recreation ---
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kyro-kafka-data:/var/lib/kafka/data
    networks:
      - kyro-net

networks:
  kyro-net:
    name: kyro-net
    driver: bridge

volumes:
  kyro-kafka-data:
