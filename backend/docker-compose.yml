# KYRO data services: PostgreSQL (source of truth) + ChromaDB (semantic index).
#
# Joins the EXISTING `kyro-net` Docker network (created by kafka/local/docker-compose.yml)
# so containers reach each other by service DNS name (n8n, kyro-kafka, kyro-postgres,
# kyro-chroma, kyro-backend). Host access uses localhost + published ports.
#
# NOTE: host port 5432 is occupied by an existing native PostgreSQL 17 instance that
# KYRO does NOT own and must never touch -> kyro-postgres publishes on 5433 instead.

services:
  kyro-postgres:
    image: postgres:16-alpine
    container_name: kyro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyro
      POSTGRES_PASSWORD: kyro
      POSTGRES_DB: kyro
    ports:
      - "5433:5432"
    volumes:
      - kyro-postgres-data:/var/lib/postgresql/data
    networks:
      - kyro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyro -d kyro"]
      interval: 5s
      timeout: 3s
      retries: 20

  kyro-chroma:
    image: chromadb/chroma:latest
    container_name: kyro-chroma
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - kyro-chroma-data:/chroma/chroma
    networks:
      - kyro-net
    healthcheck:
      # Chroma >=1.x only serves /api/v2/heartbeat (v1 returns 410 Gone).
      # The image ships no python/curl/wget -> probe with bash /dev/tcp
      # (must be invoked via bash: /bin/sh has no /dev/tcp support).
      test:
        [
          "CMD-SHELL",
          "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  # Backend API + ingestion worker containers (built from backend/Dockerfile).
  # Inside the network they use: kyro-postgres:5432, kyro-chroma:8000, kyro-kafka:29092.
  kyro-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: kyro-backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://kyro:kyro@kyro-postgres:5432/kyro
      CHROMA_URL: http://kyro-chroma:8000
      KAFKA_BOOTSTRAP_SERVERS: kyro-kafka:29092
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-/run/secrets/github_app_key.pem}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      SYNC_SUPERVISOR_ENABLED: ${SYNC_SUPERVISOR_ENABLED:-1}
    ports:
      - "8000:8000"
    networks:
      - kyro-net
    depends_on:
      kyro-postgres:
        condition: service_healthy
      kyro-chroma:
        condition: service_started

  kyro-worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: kyro-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker_main"]
    environment:
      DATABASE_URL: postgresql+psycopg://kyro:kyro@kyro-postgres:5432/kyro
      CHROMA_URL: http://kyro-chroma:8000
      KAFKA_BOOTSTRAP_SERVERS: kyro-kafka:29092
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-/run/secrets/github_app_key.pem}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
    networks:
      - kyro-net
    depends_on:
      kyro-postgres:
        condition: service_healthy
      kyro-chroma:
        condition: service_started

networks:
  kyro-net:
    external: true

volumes:
  kyro-postgres-data:
  kyro-chroma-data:
