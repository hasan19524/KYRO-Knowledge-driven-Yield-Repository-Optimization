name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: kyro
          POSTGRES_PASSWORD: kyro
          POSTGRES_DB: kyro
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U kyro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      chroma:
        image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
        ports:
          - "8100:8000"
      kafka:
        image: apache/kafka:4.3.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_LOG_RETENTION_MS: 604800000
        ports:
          - "9092:9092"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest ruff pyright

      - name: ruff
        run: ruff check app tests alembic
        working-directory: backend

      - name: pyright
        run: pyright
        working-directory: backend

      - name: Wait for service ports
        run: |
          for port in 5433 8100 9092; do
            for i in $(seq 1 60); do
              (echo > /dev/tcp/localhost/$port) >/dev/null 2>&1 && break
              sleep 2
            done
            (echo > /dev/tcp/localhost/$port) >/dev/null 2>&1 || { echo "port $port never opened"; exit 1; }
          done

      - name: pytest
        run: python -m pytest tests/ -q
        working-directory: backend

  frontend:
    name: frontend (eslint, next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: lint
        run: npm run lint
        working-directory: frontend

      - name: build
        run: npm run build
        working-directory: frontend

  compose:
    name: compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Stack A
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Validate Stack B
        run: docker compose -f app/docker-compose.yml config --quiet
